# The checks in doc 10 that exist so far. The coverage gate, web lint, Terraform, the secret scan, SonarQube Cloud,
# and Playwright (which needs a running stack with data) join as each one is built.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # Unit tests, the Testcontainers integration tests, the module boundary test, and the OpenAPI drift check.
      - run: ./mvnw --batch-mode verify

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # Each script first regenerates the typed client from backend/openapi.json.
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
