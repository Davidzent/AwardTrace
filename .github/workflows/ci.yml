# The checks in doc 10 that exist so far. Playwright, which needs a running stack with data, joins once it can have
# one. CodeQL runs in its own workflow. A push to main that passes every check deploys (deploy.yml).
name: CI

on:
  # Pushes to main only: every other branch reaches main through a pull request, whose run checks it, so a branch
  # never runs twice.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push cancels a pull request's older run, except on main, where a run may be deploying.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # Unit tests, the Testcontainers integration tests, the module boundary test, the OpenAPI drift check, and the
      # JaCoCo coverage gate.
      - run: ./mvnw --batch-mode verify
      # Each failed test becomes an annotation on the run's summary, with its message and first stack frames.
      - if: failure()
        run: |
          for report in target/surefire-reports/*.txt target/failsafe-reports/*.txt; do
            [ -f "$report" ] || continue
            awk 'function escape(s) { gsub(/%/, "%25", s); gsub(/\r/, "", s); return s }
                 /<<< (FAILURE|ERROR)!/ && !/^Tests run:/ {
                   message = escape($0)
                   for (i = 0; i < 4 && (getline line) > 0; i++) message = message "%0A" escape(line)
                   print "::error title=Test failed::" message
                 }' "$report"
          done

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      # Each script first regenerates the typed client from backend/openapi.json.
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # pages.yml publishes this on main; building it here catches a break, such as a changed docs/results.md, first.
      - run: npm run build:landing

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false
      - run: terraform fmt -check -recursive infra/terraform
      # The wake function's logic, with stand-ins for AWS (ADR 0020). The runner's own Node.js runs it.
      - run: node --test infra/terraform/modules/wake/function/wake.test.mjs
      # Every root, without its backend, so validation needs no AWS credentials. Modules are checked through the
      # roots that use them.
      - run: |
          for root in infra/terraform/bootstrap infra/terraform/envs/*; do
            [ -d "$root" ] || continue
            terraform -chdir="$root" init -backend=false -input=false
            terraform -chdir="$root" validate
          done

  # A push to this repository's main only; pull requests, forks among them, never reach it. Until AWS exists and the
  # AWS_DEPLOY_ROLE_ARN repository variable is set, there is nothing to deploy to, so the job is skipped.
  deploy:
    needs: [backend, web, terraform]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ROLE_ARN != ''
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
