# The api role: the read-only REST API under /api/v1 (docs 07).
server:
  # Caddy sends X-Forwarded-For; Tomcat trusts it only from internal proxy addresses (RateLimiting).
  forward-headers-strategy: native
spring:
  main:
    web-application-type: servlet
  mvc:
    # Every error, including the framework's own, is RFC 9457 problem details.
    problemdetails:
      enabled: true
  jackson:
    property-naming-strategy: SNAKE_CASE
springdoc:
  api-docs:
    path: /api/v1/openapi.json
  paths-to-match: /api/v1/**
  # Sorted, indented output, so the committed openapi.json diffs cleanly.
  writer-with-order-by-keys: true
  writer-with-default-pretty-printer: true
  default-produces-media-type: application/json
