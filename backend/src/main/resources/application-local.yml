# Local development against infra/compose/compose.local.yml. Activate with the "local" profile.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/awardtrace
    username: awardtrace
    password: awardtrace

awardtrace:
  s3:
    bucket: awardtrace-raw
    endpoint: http://localhost:9090
  ingest:
    # The Department of Agriculture only: about 15 MB a fiscal year, instead of 3.3 GB for every agency.
    agencies: "012"
