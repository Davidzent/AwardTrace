spring:
  application:
    name: awardtrace
  kafka:
    producer:
      # acks=all is the default since Kafka 3.0; it is set explicitly so nobody lowers it.
      acks: all
      compression-type: zstd
      batch-size: 128KB
      properties:
        enable.idempotence: true
        linger.ms: 20
    consumer:
      # A new consumer group rebuilds from the start of each topic.
      auto-offset-reset: earliest
      # One database transaction per poll batch.
      max-poll-records: 500
    listener:
      concurrency: 2

awardtrace:
  s3:
    region: us-east-1
  ingest:
    archive-url: https://files.usaspending.gov/award_data_archive/
