spring:
  application:
    name: awardtrace
  main:
    # Only the api role serves HTTP (application-api.yml), so other roles and one-shot tasks never bind a port.
    web-application-type: none
  jpa:
    # Flyway owns the schema; Hibernate only checks that the read models match it (ADR 0008).
    hibernate:
      ddl-auto: validate
    open-in-view: false
  kafka:
    producer:
      # acks=all is the default since Kafka 3.0; it is set explicitly so nobody lowers it.
      acks: all
      compression-type: zstd
      batch-size: 128KB
      properties:
        enable.idempotence: true
        linger.ms: 20
    consumer:
      # A new consumer group rebuilds from the start of each topic.
      auto-offset-reset: earliest
      # One database transaction per poll batch.
      max-poll-records: 500
    listener:
      concurrency: 2

awardtrace:
  s3:
    region: us-east-1
  ingest:
    archive-url: https://files.usaspending.gov/award_data_archive/
    api-url: https://api.usaspending.gov/
    download-poll-interval: 5s
    download-deadline: 15m
  enrichment:
    # Haiku 4.5 classifies every description; Opus 5.5 runs once, on the gold set, as a ceiling check (doc 09).
    model: claude-haiku-4-5
    prompt-version: v1
    daily-cap-usd: 1.00
    eval:
      # Relative to backend/, where eval/README.md runs the task. A run costs about $0.04 on Haiku 4.5 and $0.20 on Opus.
      gold-set: ../eval/gold.csv
      report-dir: ../eval/results
      summary: ../docs/results.md
      cap-usd: 1.00
    backfill:
      # Give cap-usd on each run. A batch's worst case counts against it before the batch is submitted: on Haiku 4.5,
      # 200 requests could cost at most about $2.50 at batch prices, and typically cost well under $1.
      requests-per-batch: 200
      poll-interval: 1m
