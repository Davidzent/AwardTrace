# Local development: docker compose -f infra/compose/compose.yml -f infra/compose/compose.local.yml up -d --wait

services:
  kafka:
    ports:
      - "9092:9092"

  postgres:
    environment:
      POSTGRES_PASSWORD: awardtrace
    ports:
      # 5433 on the host, so a natively installed PostgreSQL on 5432 can keep running.
      - "5433:5432"

  elasticsearch:
    environment:
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs 'http://localhost:9200/_cluster/health?wait_for_status=green&timeout=5s'"]
      interval: 10s
      timeout: 10s
      retries: 12

  # Stands in for Amazon S3 locally. See docs/decisions/0011-s3mock-for-local-s3.md.
  s3mock:
    image: adobe/s3mock:5.2.3
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: awardtrace-raw
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /s3mockroot
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
    ports:
      - "9090:9090"
    volumes:
      - s3mock-data:/s3mockroot
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/favicon.ico"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  s3mock-data:
