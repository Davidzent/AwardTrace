<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>AwardTrace has moved</title>
    <script>
      // GitHub Pages answers every unknown path with this page. Most are old links to the app, such as /awards/{id},
      // from before it moved to its own hostname (ADR 0019), so each goes to the same path there.
      location.replace('https://app.awardtrace.zntsns.com' + location.pathname + location.search + location.hash);
    </script>
  </head>
  <body>
    <p>
      The app moved to <a href="https://app.awardtrace.zntsns.com/">app.awardtrace.zntsns.com</a>. Read about it on the
      <a href="https://awardtrace.zntsns.com/">AwardTrace home page</a>.
    </p>
  </body>
</html>
